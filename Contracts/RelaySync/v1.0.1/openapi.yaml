---
openapi: 3.1.0
info:
  title: Relay Sync API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
security:
- bearerAuth: []
paths:
  "/healthz":
    get:
      security: []
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/v1/auth/apple/challenges":
    post:
      security: []
      operationId: createAppleAuthChallenge
      responses:
        '201':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AppleAuthChallenge"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/auth/apple":
    post:
      security: []
      operationId: authenticateWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppleAuthRequest"
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/auth/apple/start":
    get:
      operationId: startPortalAppleAuth
      security: []
      responses:
        '302': {}
        '404':
          "$ref": "#/components/responses/Problem"
        '421':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
  "/auth/apple/callback":
    post:
      operationId: completePortalAppleAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code:
                  type: string
                state:
                  type: string
                error:
                  type: string
      responses:
        '303': {}
        '404':
          "$ref": "#/components/responses/Problem"
        '421':
          "$ref": "#/components/responses/Problem"
  "/v1/auth/logout":
    post:
      operationId: logout
      responses:
        '204': {}
        '401':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/auth/rotate":
    post:
      operationId: rotateSession
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
  "/v1/account":
    get:
      operationId: getAccount
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
        '401':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/account/export":
    get:
      operationId: exportAccountMetadata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
        '401':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/account/vault/delete":
    post:
      operationId: deleteVaultNow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirmation
              properties:
                confirmation:
                  const: DELETE RELAY SYNC DATA
      responses:
        '202': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
  "/v1/devices":
    get:
      operationId: listDevices
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Device"
        '401':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/devices/{id}":
    delete:
      operationId: revokeDevice
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      responses:
        '204': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
  "/v1/content/uploads":
    post:
      operationId: prepareUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PrepareContent"
      responses:
        '201':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PreparedUpload"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/uploads/{id}":
    get:
      operationId: getUploadStatus
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UploadStatus"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
  "/v1/content/uploads/{id}/parts/{part}":
    post:
      operationId: presignMultipartPart
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      - name: part
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PresignedRequest"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '410':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/uploads/{id}/complete":
    post:
      operationId: completeUpload
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required:
                    - number
                    - etag
                    properties:
                      number:
                        type: integer
                        minimum: 1
                        maximum: 10000
                      etag:
                        type: string
                        maxLength: 128
      responses:
        '202': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '410':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/claims":
    post:
      operationId: prepareProofClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PrepareContent"
      responses:
        '201':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProofChallenge"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/claims/{id}/verify":
    post:
      operationId: verifyProofClaim
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - digest
              properties:
                digest:
                  "$ref": "#/components/schemas/SHA256Hex"
      responses:
        '204': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '403':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/downloads/{fingerprint}":
    get:
      operationId: authorizeDownload
      parameters:
      - "$ref": "#/components/parameters/FingerprintHexPath"
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - download
                - size
                properties:
                  download:
                    "$ref": "#/components/schemas/PresignedRequest"
                  size:
                    type: integer
                    format: int64
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
  "/v1/sync/push":
    post:
      operationId: pushSemanticOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PushRequest"
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PushResponse"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
  "/v1/sync/changes":
    get:
      operationId: getSemanticChanges
      parameters:
      - name: cursor
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ChangesResponse"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/sync/games/{fingerprint}/battery-heads":
    get:
      operationId: getBatteryHeads
      parameters:
      - "$ref": "#/components/parameters/FingerprintHexPath"
      - name: cursor
        in: query
        schema:
          "$ref": "#/components/schemas/UUID"
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 2
          maximum: 500
          default: 100
      - name: snapshot
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HeadsResponse"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/UUID"
    FingerprintHexPath:
      name: fingerprint
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/SHA256Hex"
  responses:
    Problem:
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    UUID:
      type: string
      format: uuid
    SHA256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Fingerprint:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    AppleAuthRequest:
      type: object
      additionalProperties: false
      required:
      - identityToken
      - challengeID
      - installationID
      - deviceKind
      properties:
        identityToken:
          type: string
          minLength: 1
        challengeID:
          "$ref": "#/components/schemas/UUID"
        installationID:
          "$ref": "#/components/schemas/UUID"
        deviceKind:
          "$ref": "#/components/schemas/DeviceKind"
    AppleAuthChallenge:
      type: object
      required:
      - challengeID
      - nonce
      - expiresAt
      properties:
        challengeID:
          "$ref": "#/components/schemas/UUID"
        nonce:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        expiresAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required:
      - accessToken
      - expiresAt
      - relayAccountID
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        relayAccountID:
          "$ref": "#/components/schemas/UUID"
    DeviceKind:
      type: string
      enum:
      - iphone
      - ipad
      - appletv
      - mac
      - android
      - unknown
    Device:
      type: object
      properties:
        ID:
          "$ref": "#/components/schemas/UUID"
        Kind:
          "$ref": "#/components/schemas/DeviceKind"
        CreatedAt:
          type: string
          format: date-time
        LastSeenAt:
          type: string
          format: date-time
        LastSyncAt:
          type:
          - string
          - 'null'
          format: date-time
        RevokedAt:
          type:
          - string
          - 'null'
          format: date-time
    PrepareContent:
      oneOf:
      - "$ref": "#/components/schemas/PrepareGameContent"
      - "$ref": "#/components/schemas/PrepareCriticalContent"
    PrepareGameContent:
      type: object
      additionalProperties: false
      required:
      - fingerprint
      - size
      - storageClass
      - target
      properties:
        fingerprint:
          "$ref": "#/components/schemas/Fingerprint"
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 600000000000
        storageClass:
          const: game
        target:
          "$ref": "#/components/schemas/GameContentTarget"
    PrepareCriticalContent:
      type: object
      additionalProperties: false
      required:
      - fingerprint
      - size
      - storageClass
      - target
      properties:
        fingerprint:
          "$ref": "#/components/schemas/Fingerprint"
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 600000000000
        storageClass:
          const: critical
        target:
          oneOf:
          - "$ref": "#/components/schemas/StateContentTarget"
          - "$ref": "#/components/schemas/ScreenshotContentTarget"
    GameContentTarget:
      type: object
      additionalProperties: false
      required:
      - category
      - ref_type
      - ref_key
      properties:
        category:
          const: games
        ref_type:
          const: game_content
        ref_key:
          "$ref": "#/components/schemas/Fingerprint"
    StateContentTarget:
      type: object
      additionalProperties: false
      required:
      - category
      - ref_type
      - ref_key
      properties:
        category:
          const: saves_states
        ref_type:
          type: string
          enum:
          - battery_payload
          - save_state_payload
        ref_key:
          "$ref": "#/components/schemas/UUID"
    ScreenshotContentTarget:
      type: object
      additionalProperties: false
      required:
      - category
      - ref_type
      - ref_key
      properties:
        category:
          const: screenshots_other
        ref_type:
          type: string
          enum:
          - battery_screenshot
          - save_state_screenshot
          - session_screenshot
        ref_key:
          "$ref": "#/components/schemas/UUID"
    PresignedRequest:
      type: object
      required:
      - url
      - method
      - headers
      - expires_at
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
          - GET
          - PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    PreparedUpload:
      type: object
      required:
      - upload_id
      - mode
      - expires_at
      properties:
        upload_id:
          "$ref": "#/components/schemas/UUID"
        mode:
          type: string
          enum:
          - single
          - multipart
        part_size:
          type: integer
          format: int64
        part_count:
          type: integer
          maximum: 10000
        upload:
          "$ref": "#/components/schemas/PresignedRequest"
        expires_at:
          type: string
          format: date-time
    UploadStatus:
      type: object
      required:
      - upload_id
      - status
      - error_code
      - blob_id
      properties:
        upload_id:
          "$ref": "#/components/schemas/UUID"
        status:
          type: string
          enum:
          - PREPARED
          - UPLOADING
          - VERIFYING
          - COMPLETE
          - FAILED
          - EXPIRED
        error_code:
          type:
          - string
          - 'null'
        blob_id:
          anyOf:
          - "$ref": "#/components/schemas/UUID"
          - type: 'null'
    ProofRange:
      type: object
      required:
      - offset
      - length
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
        length:
          type: integer
          format: int64
          minimum: 1
          maximum: 65536
    ProofChallenge:
      type: object
      required:
      - challenge_id
      - nonce
      - ranges
      - expires_at
      properties:
        challenge_id:
          "$ref": "#/components/schemas/UUID"
        nonce:
          "$ref": "#/components/schemas/SHA256Hex"
        ranges:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/ProofRange"
        expires_at:
          type: string
          format: date-time
    Operation:
      type: object
      additionalProperties: false
      required:
      - operationId
      - schema
      - kind
      - action
      - object
      properties:
        operationId:
          "$ref": "#/components/schemas/UUID"
        schema:
          const: 1
        kind:
          type: string
          enum:
          - game
          - battery_revision
          - save_state
          - play_session
          - tombstone
          - content_availability
        action:
          type: string
          enum:
          - upsert
          - delete
        object:
          type: object
    PushRequest:
      type: object
      additionalProperties: false
      required:
      - operations
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            "$ref": "#/components/schemas/Operation"
    OperationResult:
      type: object
      required:
      - operationId
      - status
      properties:
        operationId:
          "$ref": "#/components/schemas/UUID"
        status:
          type: string
          enum:
          - applied
          - duplicate
          - ignored
          - deferred
          - rejected
        sequence:
          type: integer
          format: int64
          minimum: 1
        error:
          type: string
        missingKeys:
          type: array
          items:
            type: string
    PushResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            "$ref": "#/components/schemas/OperationResult"
    Change:
      type: object
      required:
      - sequence
      - kind
      - objectKey
      - operation
      - object
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
        objectKey:
          type: string
        operation:
          type: string
          enum:
          - upsert
          - delete
        object:
          type: object
    ChangesResponse:
      type: object
      required:
      - changes
      - nextCursor
      - hasMore
      properties:
        changes:
          type: array
          items:
            "$ref": "#/components/schemas/Change"
        nextCursor:
          type: integer
          format: int64
          minimum: 0
        hasMore:
          type: boolean
    HeadsResponse:
      type: object
      required:
      - fingerprint
      - heads
      - conflict
      - hasMore
      - snapshotSequence
      properties:
        fingerprint:
          "$ref": "#/components/schemas/Fingerprint"
        heads:
          type: array
          items:
            "$ref": "#/components/schemas/UUID"
        conflict:
          type: boolean
        nextCursor:
          anyOf:
          - "$ref": "#/components/schemas/UUID"
          - type: 'null'
        hasMore:
          type: boolean
        snapshotSequence:
          type: integer
          format: int64
          minimum: 0
