---
openapi: 3.1.0
info:
  title: Relay Sync API
  version: 1.3.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
security:
- bearerAuth: []
paths:
  "/healthz":
    get:
      security: []
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/v1/auth/apple/challenges":
    post:
      security: []
      operationId: createAppleAuthChallenge
      responses:
        '201':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AppleAuthChallenge"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/auth/apple":
    post:
      security: []
      operationId: authenticateWithApple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppleAuthRequest"
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/auth/apple/start":
    get:
      operationId: startPortalAppleAuth
      security: []
      responses:
        '302': {}
        '404':
          "$ref": "#/components/responses/Problem"
        '421':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
  "/auth/apple/callback":
    post:
      operationId: completePortalAppleAuth
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code:
                  type: string
                state:
                  type: string
                error:
                  type: string
      responses:
        '303': {}
        '404':
          "$ref": "#/components/responses/Problem"
        '421':
          "$ref": "#/components/responses/Problem"
  "/v1/auth/logout":
    post:
      operationId: logout
      responses:
        '204': {}
        '401':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/auth/rotate":
    post:
      operationId: rotateSession
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
  "/v1/account":
    get:
      operationId: getAccount
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
        '401':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/account/export":
    get:
      operationId: exportAccountMetadata
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
        '401':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/account/vault/delete":
    post:
      operationId: deleteVaultNow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirmation
              properties:
                confirmation:
                  const: DELETE RELAY SYNC DATA
      responses:
        '202': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
  "/v1/devices":
    get:
      operationId: listDevices
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Device"
        '401':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/devices/{id}":
    delete:
      operationId: revokeDevice
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      responses:
        '204': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
  "/v1/content/uploads":
    post:
      operationId: prepareUpload
      parameters:
      - "$ref": "#/components/parameters/SyncSchema"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PrepareContent"
      responses:
        '201':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PreparedUpload"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '426':
          "$ref": "#/components/responses/SyncUpgradeRequired"
        '409':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/uploads/{id}":
    get:
      operationId: getUploadStatus
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UploadStatus"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
  "/v1/content/uploads/{id}/parts/{part}":
    post:
      operationId: presignMultipartPart
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      - name: part
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PresignedRequest"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '410':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/uploads/{id}/complete":
    post:
      operationId: completeUpload
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required:
                    - number
                    - etag
                    properties:
                      number:
                        type: integer
                        minimum: 1
                        maximum: 10000
                      etag:
                        type: string
                        maxLength: 128
      responses:
        '202': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '410':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/claims":
    post:
      operationId: prepareProofClaim
      parameters:
      - "$ref": "#/components/parameters/SyncSchema"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PrepareContent"
      responses:
        '201':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProofChallenge"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '426':
          "$ref": "#/components/responses/SyncUpgradeRequired"
        '409':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/claims/{id}/verify":
    post:
      operationId: verifyProofClaim
      parameters:
      - "$ref": "#/components/parameters/UUIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - digest
              properties:
                digest:
                  "$ref": "#/components/schemas/SHA256Hex"
      responses:
        '204': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '403':
          "$ref": "#/components/responses/Problem"
        '409':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/content/downloads/{fingerprint}":
    get:
      operationId: authorizeDownload
      parameters:
      - "$ref": "#/components/parameters/FingerprintHexPath"
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - download
                - size
                properties:
                  download:
                    "$ref": "#/components/schemas/PresignedRequest"
                  size:
                    type: integer
                    format: int64
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
  "/v1/covers/{system}/{digest}":
    get:
      operationId: catalogCover
      security: []
      parameters:
      - name: system
        in: path
        required: true
        schema:
          type: string
          enum:
          - gb
          - gbc
          - gba
          - nes
          - snes
          - nds
          - sms
          - gg
          - pce
          - ws
          - wsc
          - ps1
      - name: digest
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{64}$"
      responses:
        '302':
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
  "/v1/sync/push":
    post:
      operationId: pushSemanticOperations
      parameters:
      - "$ref": "#/components/parameters/SyncSchema"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PushRequest"
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PushResponse"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '426':
          "$ref": "#/components/responses/SyncUpgradeRequired"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '423':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
  "/v1/sync/changes":
    get:
      operationId: getSemanticChanges
      parameters:
      - "$ref": "#/components/parameters/SyncSchema"
      - name: cursor
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ChangesResponse"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '426':
          "$ref": "#/components/responses/SyncUpgradeRequired"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/sync/games/{fingerprint}/battery-heads":
    get:
      operationId: getBatteryHeads
      parameters:
      - "$ref": "#/components/parameters/SyncSchema"
      - "$ref": "#/components/parameters/FingerprintHexPath"
      - name: generation
        in: query
        required: true
        schema:
          "$ref": "#/components/schemas/Generation"
      - name: cursor
        in: query
        schema:
          "$ref": "#/components/schemas/UUID"
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 2
          maximum: 500
          default: 100
      - name: snapshot
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HeadsResponse"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '426':
          "$ref": "#/components/responses/SyncUpgradeRequired"
        '409':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/Problem"
        '503':
          "$ref": "#/components/responses/Problem"
        '500':
          "$ref": "#/components/responses/Problem"
  "/v1/transfer/presence":
    post:
      operationId: announceTransferPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - deviceKind
              properties:
                deviceKind:
                  "$ref": "#/components/schemas/TransferDeviceKind"
                presenceID:
                  "$ref": "#/components/schemas/UUID"
      responses:
        '200':
          "$ref": "#/components/responses/Presence"
        '201':
          "$ref": "#/components/responses/Presence"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/Problem"
  "/v1/transfer/presence/{id}":
    delete:
      operationId: leaveTransferPresence
      parameters:
      - "$ref": "#/components/parameters/ResourceID"
      responses:
        '204': {}
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
  "/v1/transfer/signal":
    get:
      operationId: attachNativeTransferSignal
      parameters:
      - name: presenceID
        in: query
        required: true
        schema:
          "$ref": "#/components/schemas/UUID"
      responses:
        '101': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '403':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/portal/transfer":
    get:
      operationId: showTransferPage
      security:
      - portalCookie: []
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
        '303': {}
        '404':
          "$ref": "#/components/responses/Problem"
  "/portal/transfer/devices":
    get:
      operationId: listTransferDevices
      security:
      - portalCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - devices
                properties:
                  devices:
                    type: array
                    maxItems: 5
                    items:
                      "$ref": "#/components/schemas/WaitingDevice"
        '401':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/portal/transfer/sessions":
    post:
      operationId: createTransferSession
      security:
      - portalCookie: []
        portalCSRF: []
      parameters:
      - "$ref": "#/components/parameters/PortalOrigin"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - presenceID
              - csrf
              properties:
                presenceID:
                  "$ref": "#/components/schemas/UUID"
                csrf:
                  type: string
                  minLength: 1
      responses:
        '201':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransferSession"
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '403':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/Problem"
  "/portal/transfer/sessions/{id}/signal":
    get:
      operationId: attachBrowserTransferSignal
      security:
      - portalCookie: []
      parameters:
      - "$ref": "#/components/parameters/ResourceID"
      - "$ref": "#/components/parameters/PortalOrigin"
      responses:
        '101': {}
        '400':
          "$ref": "#/components/responses/Problem"
        '401':
          "$ref": "#/components/responses/Problem"
        '403':
          "$ref": "#/components/responses/Problem"
        '404':
          "$ref": "#/components/responses/Problem"
        '409':
          "$ref": "#/components/responses/Problem"
        '429':
          "$ref": "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    portalCookie:
      type: apiKey
      in: cookie
      name: relay_portal
    portalCSRF:
      type: apiKey
      in: cookie
      name: relay_csrf
  parameters:
    SyncSchema:
      name: X-Relay-Sync-Schema
      in: header
      required: true
      schema:
        type: string
        enum:
        - '2'
        - '3'
    UUIDPath:
      name: id
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/UUID"
    FingerprintHexPath:
      name: fingerprint
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/SHA256Hex"
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/UUID"
    PortalOrigin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
  responses:
    SyncUpgradeRequired:
      headers:
        X-Relay-Sync-Schema:
          schema:
            type: string
            const: '3'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Problem:
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Presence:
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TransferPresence"
    RateLimited:
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    UUID:
      type: string
      format: uuid
    SHA256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Fingerprint:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    Generation:
      type: integer
      format: int64
      minimum: 0
      maximum: 2147483647
    Milliseconds:
      type: integer
      format: int64
      minimum: 946684800000
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    AppleAuthRequest:
      type: object
      additionalProperties: false
      required:
      - identityToken
      - challengeID
      - installationID
      - deviceKind
      properties:
        identityToken:
          type: string
          minLength: 1
        challengeID:
          "$ref": "#/components/schemas/UUID"
        installationID:
          "$ref": "#/components/schemas/UUID"
        deviceKind:
          "$ref": "#/components/schemas/DeviceKind"
    AppleAuthChallenge:
      type: object
      required:
      - challengeID
      - nonce
      - expiresAt
      properties:
        challengeID:
          "$ref": "#/components/schemas/UUID"
        nonce:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        expiresAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required:
      - accessToken
      - expiresAt
      - relayAccountID
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        relayAccountID:
          "$ref": "#/components/schemas/UUID"
    DeviceKind:
      type: string
      enum:
      - iphone
      - ipad
      - appletv
      - mac
      - android
      - unknown
    Device:
      type: object
      properties:
        ID:
          "$ref": "#/components/schemas/UUID"
        Kind:
          "$ref": "#/components/schemas/DeviceKind"
        CreatedAt:
          type: string
          format: date-time
        LastSeenAt:
          type: string
          format: date-time
        LastSyncAt:
          type:
          - string
          - 'null'
          format: date-time
        RevokedAt:
          type:
          - string
