<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2320 720" width="2320" height="720">
  <!--
    Default Top Shelf, wide, 2320 × 720. This is its own composition, not the
    1920 plate stretched: tvOS shows the central 1920 at rest and pans the extra
    200 on each side with the parallax, so the lockup is centred in the full
    2320 and identical in size to the standard plate. The ground runs the full
    width so a pan never reveals an edge.
  -->
  <defs>
    <radialGradient id="ground" cx="0.5" cy="0.1" r="1.0">
      <stop offset="0" stop-color="#28241F"/>
      <stop offset="0.6" stop-color="#1C1917"/>
      <stop offset="1" stop-color="#121110"/>
    </radialGradient>
  </defs>
  <rect width="2320" height="720" fill="url(#ground)"/>
  <g transform="translate(830 366) scale(2.87) rotate(-45)">
    <rect x="-46" y="-18" width="44" height="14" rx="7" fill="#F5F2EE"/>
    <rect x="2" y="4" width="44" height="14" rx="7" fill="#FF6A45"/>
  </g>
  <text x="1010" y="352" font-family="-apple-system, SF Pro Display, Helvetica Neue, Arial" font-size="118" font-weight="600" letter-spacing="-3" fill="#F5F2EE">Relay</text>
  <text x="1012" y="424" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial" font-size="44" fill="#F5F2EE" fill-opacity="0.66">Your games. Every Apple screen.</text>
</svg>
